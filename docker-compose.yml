name: gitlab-dashboard

services:
  gitlab-dashboard:
    build:
      context: .
    image: example/gitlab-dashboard:local
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    mem_limit: 384m
    memswap_limit: 384m
    cpus: "0.50"
    pids_limit: 128
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    networks:
      - app_network
    labels:
      - traefik.enable=true
      - traefik.docker.network=app_network
      - traefik.http.routers.gitlab-dashboard.rule=Host(`dashboard.example.invalid`)
      - traefik.http.routers.gitlab-dashboard.entrypoints=https
      - traefik.http.routers.gitlab-dashboard.tls=true
      - traefik.http.routers.gitlab-dashboard.tls.certresolver=cloudflare
      - traefik.http.routers.gitlab-dashboard.middlewares=gitlab-dashboard-security@docker
      - traefik.http.services.gitlab-dashboard.loadbalancer.server.port=3000
      - traefik.http.middlewares.gitlab-dashboard-security.headers.stsSeconds=31536000
      - traefik.http.middlewares.gitlab-dashboard-security.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.gitlab-dashboard-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.gitlab-dashboard-security.headers.frameDeny=true
      - traefik.http.middlewares.gitlab-dashboard-security.headers.referrerPolicy=no-referrer
      - traefik.http.middlewares.gitlab-dashboard-security.headers.customResponseHeaders.Permissions-Policy=geolocation=(), camera=(), microphone=()
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  app_network:
    external: true
